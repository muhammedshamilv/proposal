<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            font-family: 'Georgia', serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        h1 {
            font-size: 3rem;
            color: #c0392b;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .heart {
            font-size: 4rem;
            animation: pulse 1s ease-in-out infinite;
            margin-bottom: 30px;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
            position: relative;
        }

        .btn-no-placeholder {
            width: 150px;
            height: 58px;
            visibility: hidden;
        }

        .btn {
            padding: 15px 50px;
            font-size: 1.5rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }

        .btn-yes {
            background: linear-gradient(45deg, #27ae60, #2ecc71);
            color: white;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.4);
        }

        .btn-yes:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(39, 174, 96, 0.6);
        }

        .btn-no {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            color: white;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
            position: absolute;
        }

        .celebration {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .celebration h2 {
            font-size: 3rem;
            color: #27ae60;
            margin-bottom: 20px;
        }

        .celebration .hearts {
            font-size: 3rem;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: fall 3s linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
            }
        }

        .config-link {
            position: fixed;
            bottom: 10px;
            right: 10px;
            color: rgba(255,255,255,0.3);
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.3s;
        }

        .config-link:hover {
            color: rgba(255,255,255,0.7);
        }
    </style>
</head>
<body>
    <div class="container" id="question">
        <div class="heart">💕</div>
        <h1 id="proposalText">Will You Marry Me?</h1>
        <div class="buttons">
            <button class="btn btn-yes" onclick="sayYes()">Yes!</button>
            <div class="btn-no-placeholder" id="placeholder"></div>
        </div>
        <button class="btn btn-no" id="noBtn">No</button>
    </div>

    <div class="celebration" id="celebration">
        <div class="hearts">💕💍💕</div>
        <h2 id="celebrationText">Yay! I Love You!</h2>
        <div class="hearts">🎉💖🎉</div>
    </div>

    <a href="config.html" class="config-link">Configure</a>

    <script>
        const noBtn = document.getElementById('noBtn');
        const placeholder = document.getElementById('placeholder');
        const question = document.getElementById('question');
        const celebration = document.getElementById('celebration');

        // Load config from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const proposalMessage = urlParams.get('message');
        const celebrationMessage = urlParams.get('celebration');

        if (proposalMessage) {
            document.getElementById('proposalText').textContent = proposalMessage;
        }
        if (celebrationMessage) {
            document.getElementById('celebrationText').textContent = celebrationMessage;
        }

        let currentX, currentY;

        function setInitialPosition() {
            const rect = placeholder.getBoundingClientRect();
            noBtn.style.left = rect.left + 'px';
            noBtn.style.top = rect.top + 'px';
            currentX = rect.left;
            currentY = rect.top;
        }

        setInitialPosition();
        window.addEventListener('resize', setInitialPosition);

        function moveButton() {
            const padding = 20;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const yesBtn = document.querySelector('.btn-yes');
            const yesRect = yesBtn.getBoundingClientRect();
            const yesCenterX = yesRect.left + yesRect.width / 2;
            const yesCenterY = yesRect.top + yesRect.height / 2;
            const avoidRadius = 150;

            let newX, newY;
            let attempts = 0;

            do {
                newX = Math.random() * maxX + padding;
                newY = Math.random() * maxY + padding;
                attempts++;

                const distFromYes = Math.sqrt(
                    Math.pow(newX - yesCenterX, 2) + Math.pow(newY - yesCenterY, 2)
                );

                if (distFromYes > avoidRadius &&
                    (Math.abs(newX - currentX) > 100 || Math.abs(newY - currentY) > 100)) {
                    break;
                }
            } while (attempts < 100);

            currentX = newX;
            currentY = newY;

            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
        }

        document.addEventListener('mousemove', (e) => {
            const btnRect = noBtn.getBoundingClientRect();
            const btnCenterX = btnRect.left + btnRect.width / 2;
            const btnCenterY = btnRect.top + btnRect.height / 2;

            const distance = Math.sqrt(
                Math.pow(e.clientX - btnCenterX, 2) +
                Math.pow(e.clientY - btnCenterY, 2)
            );

            if (distance < 100) {
                moveButton();
            }
        });

        noBtn.addEventListener('mouseenter', moveButton);

        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            moveButton();
        });

        function sayYes() {
            question.style.display = 'none';
            celebration.style.display = 'flex';
            createConfetti();
        }

        function createConfetti() {
            const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff', '#5f27cd'];

            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    confetti.style.animationDelay = Math.random() * 0.5 + 's';
                    document.body.appendChild(confetti);

                    setTimeout(() => confetti.remove(), 5000);
                }, i * 30);
            }
        }
    </script>
</body>
</html>
