<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Georgia', serif;
            overflow: hidden;
        }

        /* Config Page Styles */
        body.config-mode {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            overflow: auto;
        }

        .config-container {
            display: none;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }

        body.config-mode .config-container {
            display: block;
        }

        .config-container h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 1.8rem;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .config-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .config-btn {
            flex: 1;
            padding: 15px 25px;
            font-size: 1.1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
            background: linear-gradient(45deg, #27ae60, #2ecc71);
            color: white;
        }

        .config-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        /* Proposal Page Styles */
        body.proposal-mode {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
        }

        .proposal-container {
            display: none;
            text-align: center;
            padding: 40px;
        }

        body.proposal-mode .proposal-container {
            display: block;
        }

        .proposal-container h1 {
            font-size: 3rem;
            color: #c0392b;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .heart {
            font-size: 4rem;
            animation: pulse 1s ease-in-out infinite;
            margin-bottom: 30px;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
            position: relative;
        }

        .btn-no-placeholder {
            width: 150px;
            height: 58px;
            visibility: hidden;
        }

        .btn {
            padding: 15px 50px;
            font-size: 1.5rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }

        .btn-yes {
            background: linear-gradient(45deg, #27ae60, #2ecc71);
            color: white;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.4);
        }

        .btn-yes:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(39, 174, 96, 0.6);
        }

        .btn-no {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            color: white;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
            position: absolute;
        }

        .celebration {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .celebration h2 {
            font-size: 3rem;
            color: #27ae60;
            margin-bottom: 20px;
        }

        .celebration .hearts {
            font-size: 3rem;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: fall 3s linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
            }
        }

        .edit-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            color: #666;
        }

        .edit-btn:hover {
            background: white;
        }

        body.proposal-mode .edit-btn {
            display: block;
        }

        body.config-mode .edit-btn {
            display: none;
        }
    </style>
</head>
<body class="config-mode">
    <!-- Config Page -->
    <div class="config-container">
        <h1>Configure Your Proposal</h1>

        <div class="form-group">
            <label for="mainQuestion">Main Question</label>
            <input type="text" id="configMainQuestion" value="Will You Marry Me?">
        </div>

        <div class="form-group">
            <label for="yesButtonText">Yes Button Text</label>
            <input type="text" id="configYesButton" value="Yes!">
        </div>

        <div class="form-group">
            <label for="noButtonText">No Button Text</label>
            <input type="text" id="configNoButton" value="No">
        </div>

        <div class="form-group">
            <label for="celebrationTitle">Celebration Message</label>
            <input type="text" id="configCelebration" value="Yay! I Love You!">
        </div>

        <div class="form-group">
            <label for="topEmoji">Top Emoji</label>
            <input type="text" id="configTopEmoji" value="💕">
        </div>

        <div class="form-group">
            <label for="celebrationEmoji">Celebration Emoji</label>
            <input type="text" id="configCelebrationEmoji" value="💕💍💕">
        </div>

        <div class="config-buttons">
            <button class="config-btn" onclick="launchProposal()">Launch Proposal</button>
        </div>
    </div>

    <!-- Proposal Page -->
    <button class="edit-btn" onclick="showConfig()">Edit Messages</button>

    <div class="proposal-container" id="question">
        <div class="heart" id="topEmoji">💕</div>
        <h1 id="mainQuestion">Will You Marry Me?</h1>
        <div class="buttons">
            <button class="btn btn-yes" id="yesBtn" onclick="sayYes()">Yes!</button>
            <div class="btn-no-placeholder" id="placeholder"></div>
        </div>
        <button class="btn btn-no" id="noBtn">No</button>
    </div>

    <div class="celebration" id="celebration">
        <div class="hearts" id="celebrationEmoji">💕💍💕</div>
        <h2 id="celebrationTitle">Yay! I Love You!</h2>
        <div class="hearts">🎉💖🎉</div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const placeholder = document.getElementById('placeholder');
        const question = document.getElementById('question');
        const celebration = document.getElementById('celebration');

        let currentX, currentY;

        function showConfig() {
            document.body.className = 'config-mode';
            // Load current values into config
            document.getElementById('configMainQuestion').value = document.getElementById('mainQuestion').textContent;
            document.getElementById('configYesButton').value = document.getElementById('yesBtn').textContent;
            document.getElementById('configNoButton').value = document.getElementById('noBtn').textContent;
            document.getElementById('configCelebration').value = document.getElementById('celebrationTitle').textContent;
            document.getElementById('configTopEmoji').value = document.getElementById('topEmoji').textContent;
            document.getElementById('configCelebrationEmoji').value = document.getElementById('celebrationEmoji').textContent;
        }

        function launchProposal() {
            // Apply settings
            document.getElementById('mainQuestion').textContent = document.getElementById('configMainQuestion').value;
            document.getElementById('yesBtn').textContent = document.getElementById('configYesButton').value;
            document.getElementById('noBtn').textContent = document.getElementById('configNoButton').value;
            document.getElementById('celebrationTitle').textContent = document.getElementById('configCelebration').value;
            document.getElementById('topEmoji').textContent = document.getElementById('configTopEmoji').value;
            document.getElementById('celebrationEmoji').textContent = document.getElementById('configCelebrationEmoji').value;

            // Switch to proposal mode
            document.body.className = 'proposal-mode';

            // Reset state
            question.style.display = 'block';
            celebration.style.display = 'none';

            // Position No button
            setTimeout(setInitialPosition, 100);
        }

        function setInitialPosition() {
            const rect = placeholder.getBoundingClientRect();
            noBtn.style.left = rect.left + 'px';
            noBtn.style.top = rect.top + 'px';
            currentX = rect.left;
            currentY = rect.top;
        }

        function moveButton() {
            const padding = 20;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const yesBtn = document.querySelector('.btn-yes');
            const yesRect = yesBtn.getBoundingClientRect();
            const yesCenterX = yesRect.left + yesRect.width / 2;
            const yesCenterY = yesRect.top + yesRect.height / 2;
            const avoidRadius = 150;

            let newX, newY;
            let attempts = 0;

            do {
                newX = Math.random() * maxX + padding;
                newY = Math.random() * maxY + padding;
                attempts++;

                const distFromYes = Math.sqrt(
                    Math.pow(newX - yesCenterX, 2) + Math.pow(newY - yesCenterY, 2)
                );

                if (distFromYes > avoidRadius &&
                    (Math.abs(newX - currentX) > 100 || Math.abs(newY - currentY) > 100)) {
                    break;
                }
            } while (attempts < 100);

            currentX = newX;
            currentY = newY;

            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
        }

        document.addEventListener('mousemove', (e) => {
            if (document.body.className !== 'proposal-mode') return;

            const btnRect = noBtn.getBoundingClientRect();
            const btnCenterX = btnRect.left + btnRect.width / 2;
            const btnCenterY = btnRect.top + btnRect.height / 2;

            const distance = Math.sqrt(
                Math.pow(e.clientX - btnCenterX, 2) +
                Math.pow(e.clientY - btnCenterY, 2)
            );

            if (distance < 100) {
                moveButton();
            }
        });

        noBtn.addEventListener('mouseenter', moveButton);

        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            moveButton();
        });

        function sayYes() {
            question.style.display = 'none';
            celebration.style.display = 'flex';
            document.querySelector('.edit-btn').style.display = 'none';
            createConfetti();
        }

        function createConfetti() {
            const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff', '#5f27cd'];

            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    confetti.style.animationDelay = Math.random() * 0.5 + 's';
                    document.body.appendChild(confetti);

                    setTimeout(() => confetti.remove(), 5000);
                }, i * 30);
            }
        }

        window.addEventListener('resize', () => {
            if (document.body.className === 'proposal-mode') {
                setInitialPosition();
            }
        });
    </script>
</body>
</html>
