<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configure Proposal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Georgia', serif;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-size: 2rem;
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 10px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            width: 100%;
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: inherit;
            margin-top: 10px;
        }

        .btn-save {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-save:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn-preview {
            background: linear-gradient(45deg, #27ae60, #2ecc71);
            color: white;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.4);
        }

        .btn-preview:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(39, 174, 96, 0.6);
        }

        .saved-message {
            text-align: center;
            color: #27ae60;
            font-size: 1.1rem;
            margin-top: 15px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .saved-message.show {
            opacity: 1;
        }

        .link-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            text-align: center;
        }

        .link-section a {
            color: #667eea;
            text-decoration: none;
            font-size: 1rem;
        }

        .link-section a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Configure Your Proposal</h1>

        <div class="form-group">
            <label for="proposalMessage">Proposal Message:</label>
            <input type="text" id="proposalMessage" placeholder="Will You Marry Me?">
        </div>

        <div class="form-group">
            <label for="celebrationMessage">Celebration Message:</label>
            <input type="text" id="celebrationMessage" placeholder="Yay! I Love You!">
        </div>

        <button class="btn btn-save" onclick="saveConfig()">Save Configuration</button>
        <button class="btn btn-preview" onclick="previewProposal()">Preview Proposal</button>

        <div class="saved-message" id="savedMessage">Configuration saved!</div>

        <div class="link-section">
            <a href="index.html">Go to Proposal Page</a>
        </div>
    </div>

    <script>
        // Load existing config
        document.addEventListener('DOMContentLoaded', function() {
            const config = JSON.parse(localStorage.getItem('proposalConfig') || '{}');

            if (config.proposalMessage) {
                document.getElementById('proposalMessage').value = config.proposalMessage;
            }
            if (config.celebrationMessage) {
                document.getElementById('celebrationMessage').value = config.celebrationMessage;
            }
        });

        function saveConfig() {
            const config = {
                proposalMessage: document.getElementById('proposalMessage').value || 'Will You Marry Me?',
                celebrationMessage: document.getElementById('celebrationMessage').value || 'Yay! I Love You!'
            };

            localStorage.setItem('proposalConfig', JSON.stringify(config));

            const savedMsg = document.getElementById('savedMessage');
            savedMsg.classList.add('show');
            setTimeout(() => savedMsg.classList.remove('show'), 2000);
        }

        function previewProposal() {
            saveConfig();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
