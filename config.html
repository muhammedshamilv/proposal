<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configure Proposal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Georgia', serif;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-size: 2rem;
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 10px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            width: 100%;
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: inherit;
            margin-top: 10px;
        }

        .btn-save {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-save:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn-preview {
            background: linear-gradient(45deg, #27ae60, #2ecc71);
            color: white;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.4);
        }

        .btn-preview:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(39, 174, 96, 0.6);
        }

        .saved-message {
            text-align: center;
            color: #27ae60;
            font-size: 1.1rem;
            margin-top: 15px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .saved-message.show {
            opacity: 1;
        }

        .generated-link {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .generated-link label {
            display: block;
            margin-bottom: 10px;
            color: #555;
        }

        .generated-link input {
            width: 100%;
            padding: 12px;
            font-size: 0.9rem;
            border: 2px solid #667eea;
            border-radius: 8px;
            background: white;
            margin-bottom: 10px;
        }

        .btn-copy {
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
            padding: 10px 25px;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4);
        }

        .btn-copy:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.6);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Configure Your Proposal</h1>

        <div class="form-group">
            <label for="proposalMessage">Proposal Message:</label>
            <input type="text" id="proposalMessage" placeholder="Will You Marry Me?">
        </div>

        <div class="form-group">
            <label for="celebrationMessage">Celebration Message:</label>
            <input type="text" id="celebrationMessage" placeholder="Yay! I Love You!">
        </div>

        <button class="btn btn-save" onclick="generateLink()">Generate Link</button>
        <button class="btn btn-preview" onclick="previewProposal()">Preview Proposal</button>

        <div class="generated-link" id="generatedLink">
            <label>Your shareable link:</label>
            <input type="text" id="shareableUrl" readonly onclick="this.select()">
            <button class="btn btn-copy" onclick="copyLink()">Copy Link</button>
        </div>

        <div class="saved-message" id="savedMessage">Link copied!</div>
    </div>

    <script>
        function generateLink() {
            const proposalMessage = document.getElementById('proposalMessage').value || 'Will You Marry Me?';
            const celebrationMessage = document.getElementById('celebrationMessage').value || 'Yay! I Love You!';

            const baseUrl = window.location.origin + window.location.pathname.replace('config.html', 'index.html');
            const params = new URLSearchParams();
            params.set('message', proposalMessage);
            params.set('celebration', celebrationMessage);

            const shareableUrl = baseUrl + '?' + params.toString();
            document.getElementById('shareableUrl').value = shareableUrl;
            document.getElementById('generatedLink').style.display = 'block';
        }

        function copyLink() {
            const urlInput = document.getElementById('shareableUrl');
            urlInput.select();
            document.execCommand('copy');

            const savedMsg = document.getElementById('savedMessage');
            savedMsg.classList.add('show');
            setTimeout(() => savedMsg.classList.remove('show'), 2000);
        }

        function previewProposal() {
            const proposalMessage = document.getElementById('proposalMessage').value || 'Will You Marry Me?';
            const celebrationMessage = document.getElementById('celebrationMessage').value || 'Yay! I Love You!';

            const params = new URLSearchParams();
            params.set('message', proposalMessage);
            params.set('celebration', celebrationMessage);

            window.location.href = 'index.html?' + params.toString();
        }
    </script>
</body>
</html>
